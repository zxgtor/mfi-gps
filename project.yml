name: MFiGPS
options:
  bundleIdPrefix: com.zxgtor
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  MFiGPS:
    type: application
    platform: iOS
    sources:
      - path: MFiGPS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zxgtor.mfigps
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MFi GPS Lab
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: This experiment records the system location to determine whether iOS is using an external location source.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - framework: CoreLocation.framework
      - framework: ExternalAccessory.framework

